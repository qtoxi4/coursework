<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><link rel="stylesheet" href="/css/style.css"><title>Створити документ</title></head>
<body>
<h1>Створити документ</h1>
<form th:action="@{/documents/create}" th:object="${document}" method="post">
    <label>Номер документа:</label>
    <input type="text" th:field="*{documentNumber}" /><br>
    <label>Дата видачі:</label>
    <input type="date" th:field="*{issueDate}" /><br>
    <label>Абітурієнт:</label>
    <select th:field="*{applicantId}">
        <option th:each="a : ${applicants}" th:value="${a.id}" th:text="${a.fullName}"></option>
    </select><br>
    <button type="submit">Зберегти</button>
</form>
<a href="/documents">Назад</a>
</body>
</html>
