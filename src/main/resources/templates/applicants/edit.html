<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Редагувати заявника</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
</head>
<body>
<h1>Редагування заявника</h1>
<form th:action="@{'/applicants/edit/' + ${applicant.id}}" th:object="${applicant}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <label>ПІБ:</label>
    <input type="text" th:field="*{fullName}" required/><br/>
    <label>Дата народження:</label>
    <input type="date" th:field="*{birthDate}" required/><br/>
    <label>Додатковий бал:</label>
    <input type="number" step="0.01" th:field="*{additionalScore}"/><br/>
    <button type="submit">Оновити</button>
</form>
<a href="/applicants">Назад до списку</a>
</body>
</html>
